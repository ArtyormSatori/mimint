[package]
name = "mimint-ui"
version = "0.1.0"
edition = "2021"
description = "Mimint desktop app: ball avatar + chat UI over the Phase 1/2 brain (Phase 3, provisional egui)"

[dependencies]
eframe = "=0.37.0"
egui = "=0.37.0"
mimint-core = { path = "../mimint-core" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
