[package]
name = "mimint-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Mimint core: brain loop, guarded tools, notebook, provider registry (Phase 2)"

[dependencies]
# Phase 6: `sync` (Notify waiters for level-3 cancel) + `time`
# (backoff/cancel timing) — same crate, 0 new packages.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
toml = "0.9"
zeroize = { version = "1", features = ["alloc"] }
libc = "0.2"
# SHA-256 for sandbox code hashing and frame/artifact hashing
# (already in the lockfile via reqwest/rustls: 0 new packages).
ring = "0.17"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
