[package]
name = "mimint-body"
version = "0.1.0"
edition = "2021"
description = "Mimint body contract (ACI): one action API per OS, conformance-tested (Phase 3)"

[features]
# Development tools only: `bodyctl` is built solely with this
# feature and is never packaged in a release build. The conformance
# harness and testwin are always built (test tools, documented in
# docs/body-aci.md).
dev-tools = []

[[bin]]
name = "bodyctl"
path = "src/bin/bodyctl.rs"
required-features = ["dev-tools"]

[[bin]]
name = "conformance"
path = "src/bin/conformance.rs"

[[bin]]
name = "testwin"
path = "src/bin/testwin.rs"

[dependencies]
serde_json = "1"
# Android protocol v2 (P4.3): all already in the workspace
# lockfile via reqwest — 0 new packages. `ring` is the TLS
# crypto provider and the SHA-256 source for cert pinning.
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "std"] }
rustls-pki-types = "1"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["xtest"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
core-foundation = "0.10"

[target.'cfg(target_os = "windows")'.dependencies]
# Already in the workspace lockfile via winit (0.62): no new
# packages. Features are the Win32 API families WindowsBody uses.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
serde_json = "1"
