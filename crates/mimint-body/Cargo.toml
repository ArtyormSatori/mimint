[package]
name = "mimint-body"
version = "0.1.0"
edition = "2021"
description = "Mimint body contract (ACI): one action API per OS, conformance-tested (Phase 3)"

[dependencies]
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["xtest"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
core-foundation = "0.10"

[dev-dependencies]
serde_json = "1"
